name: Build Hoa Van Office Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/HoaVan.OfficeStudio/HoaVan.OfficeStudio.csproj

      - name: Publish Windows Portable
        run: >
          dotnet publish
          src/HoaVan.OfficeStudio/HoaVan.OfficeStudio.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist/HoaVanOfficeStudio

      - name: Download latest OfficeCLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/HoaVanOfficeStudio/tools"

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/tjscience/OfficeCLI/releases/latest" `
            -Headers @{ "User-Agent" = "HoaVanOfficeStudio-Build" }

          $asset = $release.assets | Where-Object {
            $_.name -eq "officecli-win-x64.exe"
          } | Select-Object -First 1

          if (-not $asset) {
            Write-Host "Available OfficeCLI assets:"
            $release.assets | ForEach-Object {
              Write-Host $_.name
            }
            throw "Cannot find officecli-win-x64.exe in latest OfficeCLI release."
          }

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile "dist/HoaVanOfficeStudio/tools/officecli-win-x64.exe"

      - name: Copy OfficeCLI notices
        shell: pwsh
        run: |
          if (Test-Path "NOTICE-OFFICECLI.txt") {
            Copy-Item "NOTICE-OFFICECLI.txt" `
              "dist/HoaVanOfficeStudio/NOTICE-OFFICECLI.txt"
          }

          if (Test-Path "LICENSE-OFFICECLI.txt") {
            Copy-Item "LICENSE-OFFICECLI.txt" `
              "dist/HoaVanOfficeStudio/LICENSE-OFFICECLI.txt"
          }

          if (Test-Path "THIRD-PARTY-NOTICES-OFFICECLI.txt") {
            Copy-Item "THIRD-PARTY-NOTICES-OFFICECLI.txt" `
              "dist/HoaVanOfficeStudio/THIRD-PARTY-NOTICES-OFFICECLI.txt"
          }

      - name: Verify Portable Package
        shell: pwsh
        run: |
          $app = "dist/HoaVanOfficeStudio/HoaVan.OfficeStudio.exe"
          $engine = "dist/HoaVanOfficeStudio/tools/officecli-win-x64.exe"

          if (-not (Test-Path $app)) {
            throw "HoaVan.OfficeStudio.exe is missing."
          }

          if (-not (Test-Path $engine)) {
            throw "OfficeCLI engine is missing."
          }

          $appSize = (Get-Item $app).Length
          $engineSize = (Get-Item $engine).Length

          Write-Host "APP READY: $app"
          Write-Host "App size: $appSize bytes"
          Write-Host "OFFICECLI READY: $engine"
          Write-Host "OfficeCLI size: $engineSize bytes"

          Get-ChildItem "dist/HoaVanOfficeStudio" -Recurse |
            Select-Object FullName, Length

      - name: Upload Portable App
        uses: actions/upload-artifact@v4
        with:
          name: HoaVanOfficeStudio-Portable-v1.0.3
          path: dist/HoaVanOfficeStudio/
          if-no-files-found: error
          compression-level: 6
